{% extends 'catalog/base.html' %}

{% block title %}{% if form.instance.pk %}Редактирование{% else %}Создание{% endif %} записи{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h3>{% if form.instance.pk %}Редактирование{% else %}Создание{% endif %} записи</h3>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}  <!-- Автоматический рендеринг формы -->

                        <button type="submit" class="btn btn-success">Сохранить</button>
                        <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
